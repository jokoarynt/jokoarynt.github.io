<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><link rel="icon" href="img/logo.png"><link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet"><title>Joko Ariyanto</title><style>html{font-size:100%}:root{--bg-color:#f4f4f0;--card-bg:#fff;--text-color:#000;--accent-color:#bfbfbf;--border-color:#000;--shadow-color:#000;--disabled-item-color:#888888}[data-theme=night]{--bg-color:#121212;--card-bg:#1e1e1e;--text-color:#fff;--accent-color:#bfbfbf;--border-color:#fff;--shadow-color:#fff;--disabled-item-color:#777777}body{height:100vh;display:grid;place-content:center;background:var(--bg-color);color:var(--text-color);text-align:center;font-family:monospace,sans-serif;font-size:.875rem;margin:0;overflow:hidden;transition:background .3s ease,color .3s ease}body.gb{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;margin:0;padding:24px 10px;box-sizing:border-box;overflow-y:auto!important;overflow-x:hidden!important}p{margin:0 0 .6rem}a{color:var(--text-color);text-decoration:none;font-weight:700}a:hover{background:var(--accent-color);color:#000}#container{width:300px;max-width:88vw;padding:2rem 15px 1.8rem 15px;box-sizing:border-box;background:var(--card-bg);border:3px solid var(--border-color);box-shadow:5px 5px 0 var(--shadow-color);border-radius:12px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;transition:background .3s ease,border .3s ease,box-shadow .3s ease}body.gb #container{width:450px!important;max-width:92vw!important;height:auto!important;max-height:none!important;overflow:visible!important;margin:auto auto!important;border:3px solid var(--border-color,#000000)!important;box-shadow:5px 5px 0 var(--shadow-color,#000000)!important;border-radius:12px!important}body.gb #container .bottom-navbar{border-bottom-left-radius:9px;border-bottom-right-radius:9px}body.gb #container .bottom-navbar .theme-btn{border-bottom-right-radius:9px}.nav-line{height:30px;flex:1 1 auto;min-width:40px;box-sizing:border-box;overflow:hidden;position:relative;display:flex;align-items:center;white-space:nowrap;cursor:pointer;user-select:none}.marquee-text{position:absolute;left:0;font-size:80%;font-weight:700;color:var(--text-color);animation:marquee 8s linear infinite}.nav-line.paused .marquee-text{animation-play-state:paused}@keyframes marquee{0%{transform:translateX(180px)}100%{transform:translateX(-100%)}}.bottom-navbar .theme-btn{width:32px;height:32px;flex:0 0 32px;background:var(--accent-color);border-top:2px solid var(--border-color);border-left:2px solid var(--border-color);border-right:none;border-bottom:none;border-radius:0 0 9px 0;cursor:pointer;display:grid;place-content:center;padding:0;margin:0;box-sizing:border-box;transition:background .2s ease,color .2s ease}.bottom-navbar .theme-btn:hover{background:var(--card-bg);color:var(--text-color)}.bottom-navbar .theme-btn svg{width:15px;height:15px}#avatar{image-rendering:pixelated;height:5.5em;width:5.5em;object-fit:cover;border:3px solid var(--border-color);border-radius:50%;margin-bottom:.6rem;box-shadow:3px 3px 0 var(--shadow-color);transition:transform .1s ease,box-shadow .1s ease}#avatar:hover{transform:translateY(2px);box-shadow:none}#title{margin:0 0 .2rem;font-size:2.2rem;font-family:'Lobster',cursive;font-weight:400;letter-spacing:.5px}.social-icons{display:inline-flex;gap:14px;justify-content:center;align-items:center;margin:0 0 1.5rem}.social-icons a{display:inline-flex;padding:0;background:#fff0;border:none;border-radius:0;box-shadow:none;transition:transform .15s ease,opacity .15s ease}.social-icons a:hover{background:#fff0;transform:translateY(-2px);opacity:.8;padding:0;box-shadow:none}.social-github svg{fill:#24292e}[data-theme=night] .social-github svg{fill:#fff}.social-discord svg{fill:#5865F2}.social-telegram svg{fill:#229ED9}.social-icons svg{width:18px;height:18px;transition:fill .2s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.dropdown{position:relative;display:inline-block;vertical-align:middle}.drop-btn{background:var(--card-bg);color:var(--text-color);border:2px solid var(--border-color);border-radius:6px;height:26px;padding:0 4px;font-size:85%;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:2px;box-shadow:none;transition:background .1s ease;box-sizing:border-box}.drop-btn:hover{background:var(--accent-color);color:#000}@keyframes blinkArrow{0%,100%{opacity:1}50%{opacity:.2}}.drop-arrow{font-size:90%;line-height:1;display:inline-block;animation:blinkArrow 1.2s infinite ease-in-out}.drop-menu{display:none;position:absolute;background:var(--card-bg);border:2px solid var(--border-color);border-radius:6px;z-index:99999;text-align:left;box-sizing:border-box;min-width:84px}.drop-menu.show{font-size:85%;display:block;animation:fadeIn .3s ease forwards}.drop-menu div{padding:7px 9px;cursor:pointer;color:var(--text-color);font-size:85%;font-weight:700;border-bottom:1px solid var(--border-color)}.drop-menu div.disabled-item{color:var(--disabled-item-color);opacity:.65}.drop-menu div.disabled-item:hover{background:#fff0;color:var(--disabled-item-color)}.drop-menu div:last-child{border-bottom:none}.drop-menu div:not(.disabled-item):hover{background:var(--accent-color);color:#000}.bottom-navbar{width:calc(100% + 30px);margin-left:-15px;margin-right:-15px;margin-bottom:-1.8rem;margin-top:1rem;padding:0 0 0 3px;display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--card-bg);border-top:2px solid var(--border-color);box-sizing:border-box;height:32px}.bottom-navbar .nav-left{display:flex;align-items:center;gap:3px;flex:0 0 auto}.bottom-navbar .wr-icon-btn{display:inline-flex;align-items:center;justify-content:center;height:26px;width:26px;padding:0;background:var(--accent-color);border:2px solid var(--border-color);border-radius:6px;box-shadow:none;transition:background .2s ease;color:#000;box-sizing:border-box}.bottom-navbar .wr-icon-btn:hover{background:var(--card-bg);color:var(--text-color)}.bottom-navbar .wr-icon-btn svg{width:15px;height:15px;stroke:currentColor}.fade-anim{opacity:1;visibility:visible;transition:opacity .3s ease,visibility .3s ease}.fade-anim.hidden{opacity:0;visibility:hidden;pointer-events:none;width:0;overflow:hidden;margin:0;padding:0}#giscus-wrapper{width:100%;text-align:left;box-sizing:border-box;padding:0 5px}@media (min-width:768px){#giscus-wrapper{padding:0 20px!important}}</style></head><body><div id="container"><img id="avatar" src="img/logo.png" alt="Avatar"><h1 id="title">Joko Ariyanto</h1><p>a full-stack dev</p><p class="social-icons"><a href="https://github.com/jokoarynt" target="_blank" title="GitHub" class="social-github"><svg viewBox="0 0 24 24"><path d="M12 1.25C6.06 1.25 1.25 6.06 1.25 12c0 4.75 3.08 8.78 7.35 10.2.54.1.74-.23.74-.52 0-.26-.01-1.12-.01-2.03-2.99.65-3.62-1.27-3.62-1.27-.49-1.24-1.19-1.57-1.19-1.57-.98-.67.07-.65.07-.65 1.08.08 1.65 1.11 1.65 1.11.96 1.64 2.51 1.17 3.12.89.1-.7.37-1.17.68-1.44-2.39-.27-4.9-1.19-4.9-5.31 0-1.17.42-2.13 1.11-2.88-.11-.27-.48-1.37.11-2.85 0 0 .9-.29 2.95 1.1.86-.24 1.78-.36 2.69-.36.91 0 1.83.12 2.69.36 2.05-1.39 2.95-1.1 2.95-1.1.59 1.48.22 2.58.11 2.85.69.75 1.11 1.71 1.11 2.88 0 4.13-2.52 5.04-4.92 5.3.38.33.73.98.73 1.98 0 1.43-.01 2.58-.01 2.93 0 .29.19.62.74.51 4.27-1.42 7.35-5.45 7.35-10.2 0-5.94-4.81-10.75-10.75-10.75z"/></svg></a><a href="https://discord.com/users/1559719492014186618" target="_blank" title="Discord" class="social-discord"><svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg></a><a href="https://jokoarynt.t.me" target="_blank" title="Telegram" class="social-telegram"><svg viewBox="0 0 24 24"><path d="M22.05 4.66a1.05 1.05 0 0 0-1.12-.17L2.64 11.54a1.05 1.05 0 0 0 .06 1.97l4.43 1.48 1.66 5.29a1.05 1.05 0 0 0 1.79.41l2.53-2.58 4.86 3.57a1.05 1.05 0 0 0 1.65-.63l3.1-15.4a1.05 1.05 0 0 0-.67-1.28zM9.49 14.37l9.29-6.64-7.43 8.21-.31 3.09-1.55-4.66z"/></svg></a></p><nav class="bottom-navbar"><div class="nav-left webring-container"><span class="dropdown" id="customDropdown"><button class="drop-btn" id="dropBtn" onclick="toggleDropdown(event)"><span id="dropLabel">Webring</span><span class="drop-arrow">&#9662;</span></button></span><div id="wrActionButtons" class="fade-anim hidden" style="display:inline-flex;align-items:center;gap:3px;"><a id="wr-site" class="wr-icon-btn" href="#" target="_blank" title="Webring info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></a><a id="wr-prev" class="wr-icon-btn" href="#" target="_top" title="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></a><span id="wr-rnd-wrapper" style="display:inline-flex;"><a id="wr-rnd" class="wr-icon-btn" href="#" target="_top" title="Random"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></a></span><a id="wr-next" class="wr-icon-btn" href="#" target="_top" title="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></a></div></div><div class="nav-line" id="navLine"><span class="marquee-text" id="dateTimeMarquee"></span></div><button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Change Theme"><svg id="themeIcon" viewBox="0 0 24 24"></svg></button></nav></div><div class="drop-menu" id="dropMenu"><div class="disabled-item" onclick="changeWebring('0')">Webring</div><div onclick="changeWebring('1')">Foxwells</div><div class="disabled-item" onclick="changeWebring('2')">Kanring</div><div onclick="changeWebring('3')">No AI</div><div onclick="changeWebring('4')">Octo Ring</div><div onclick="changeWebring('5')">Tokukatsu</div><div onclick="changeWebring('6')">Roboring</div></div><script>function updateDateTime(){const now=new Date();const weekday=now.toLocaleDateString('en-US',{weekday:'short'});const day=String(now.getDate()).padStart(2,'0');const month=String(now.getMonth()+1).padStart(2,'0');const year=now.getFullYear();const hours=String(now.getHours()).padStart(2,'0');const minutes=String(now.getMinutes()).padStart(2,'0');const seconds=String(now.getSeconds()).padStart(2,'0');const milliseconds=String(now.getMilliseconds()).padStart(3,'0').slice(0,2);const formattedString=`${weekday}, ${day}-${month}-${year} ${hours}:${minutes}:${seconds}:${milliseconds}`;const marquee=document.getElementById('dateTimeMarquee');if(marquee){marquee.textContent=formattedString}} let timerInterval=null;let isManualPaused=!1;function startTimer(){if(!timerInterval){timerInterval=setInterval(updateDateTime,50)}} function stopTimer(){clearInterval(timerInterval);timerInterval=null} updateDateTime();startTimer();const navLine=document.getElementById('navLine');if(navLine){navLine.addEventListener('mouseenter',()=>{if(!isManualPaused){stopTimer();navLine.classList.add('paused')}});navLine.addEventListener('mouseleave',()=>{if(!isManualPaused){updateDateTime();startTimer();navLine.classList.remove('paused')}});navLine.addEventListener('click',()=>{isManualPaused=!isManualPaused;if(isManualPaused){stopTimer();navLine.classList.add('paused')}else{updateDateTime();startTimer();navLine.classList.remove('paused')}})} function toggleDropdown(e){if(e&&e.stopPropagation)e.stopPropagation();const btn=document.getElementById('dropBtn');const menu=document.getElementById('dropMenu');if(menu.classList.contains('show')){menu.classList.remove('show')}else{const rect=btn.getBoundingClientRect();menu.style.position='fixed';menu.style.width=rect.width+'px';menu.style.left=rect.left+'px';menu.classList.add('show');const menuHeight=menu.offsetHeight;menu.style.top=(rect.top-menuHeight-4)+'px'}} window.addEventListener('click',(e)=>{const menu=document.getElementById('dropMenu');const btn=document.getElementById('dropBtn');if(menu&&menu.classList.contains('show')&&!btn.contains(e.target)){menu.classList.remove('show')}});function changeWebring(val){const names={'0':'Webring','1':'Foxwells','2':'Kanring','3':'No AI','4':'Octo Ring','5':'Tokukatsu','6':'Roboring',};const sites={'0':'#','1':'https://foxwells.garden/webring/','2':'https://ring.kan.sh','3':'https://baccyflap.com/noai','4':'https://octo-ring.com/','5':'https://tokuring.nekoweb.org','6':'https://stellophiliac.github.io/roboring/',};const prevs={'0':'#','1':'https://foxwells.garden/webring/?prv&s=jokoarynt','2':'https://ring.kan.sh/members/jokoarynt/prev','3':'https://baccyflap.com/noai/?prv&s=jok','4':'https://octo-ring.com/p/jokoarynt/prev','5':'https://tokuring.nekoweb.org?action=previous','6':'https://stellophiliac.github.io/roboring/jokoarynt/previous',};const rnds={'0':'#','1':'https://foxwells.garden/webring/?rnd','3':'https://baccyflap.com/noai/?rnd','4':'https://octo-ring.com/p/jokoarynt/random','5':'https://tokuring.nekoweb.org?action=random',};const nexts={'0':'#','1':'https://foxwells.garden/webring/?nxt&s=jokoarynt','2':'https://ring.kan.sh/members/jokoarynt/next','3':'https://baccyflap.com/noai/?nxt&s=jok','4':'https://octo-ring.com/p/jokoarynt/next','5':'https://tokuring.nekoweb.org?action=next','6':'https://stellophiliac.github.io/roboring/jokoarynt/next',};const actionButtons=document.getElementById('wrActionButtons');const dropBtn=document.getElementById('dropBtn');if(val==='0'){actionButtons.classList.add('hidden');if(dropBtn){dropBtn.style.background='#bfbfbf';dropBtn.style.color='#000'}}else{actionButtons.classList.remove('hidden');if(dropBtn){dropBtn.style.background='';dropBtn.style.color=''} document.getElementById('wr-site').href=sites[val]||sites['1'];document.getElementById('wr-prev').href=prevs[val]||prevs['1'];document.getElementById('wr-next').href=nexts[val]||nexts['1'];const rndWrapper=document.getElementById('wr-rnd-wrapper');if(val==='2'||val==='6'){rndWrapper.style.display='none'}else{rndWrapper.style.display='inline-flex';document.getElementById('wr-rnd').href=rnds[val]||rnds['1']}} document.getElementById('dropLabel').textContent=names[val]||'Webring';localStorage.setItem('selectedWebring',val);const menu=document.getElementById('dropMenu');if(menu)menu.classList.remove('show');} function updateThemeIcon(isNight){const icon=document.getElementById('themeIcon');if(!icon)return;if(isNight){icon.innerHTML='<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';icon.setAttribute('fill','none');icon.setAttribute('stroke','currentColor');icon.setAttribute('stroke-width','2')}else{icon.innerHTML='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';icon.setAttribute('fill','#000');icon.removeAttribute('stroke');icon.removeAttribute('stroke-width')}} function updateGiscusTheme(){const iframe=document.querySelector('iframe.giscus-frame');if(iframe){iframe.contentWindow.postMessage({giscus:{setConfig:{theme:'https://joko.my.id/gb/style.min.css'}}},'https://giscus.app')}} function toggleTheme(){const isNight=document.documentElement.getAttribute('data-theme')==='night';if(isNight){document.documentElement.removeAttribute('data-theme');localStorage.setItem('theme','light');updateThemeIcon(!1)}else{document.documentElement.setAttribute('data-theme','night');localStorage.setItem('theme','night');updateThemeIcon(!0)} updateGiscusTheme()} document.addEventListener('DOMContentLoaded',()=>{const savedRing=localStorage.getItem('selectedWebring')||'0';changeWebring(savedRing);const savedTheme=localStorage.getItem('theme');let isNight=!1;if(savedTheme){isNight=(savedTheme==='night')}else{isNight=window.matchMedia('(prefers-color-scheme: dark)').matches} if(isNight){document.documentElement.setAttribute('data-theme','night');updateThemeIcon(!0)}else{document.documentElement.removeAttribute('data-theme');updateThemeIcon(!1)} setTimeout(updateGiscusTheme,1500)})</script></body></html>
