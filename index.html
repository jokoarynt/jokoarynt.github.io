<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel=icon href=https://raw.githubusercontent.com/jokoarynt/jokoarynt.github.io/main/logo2.png>
  <title>Joko Ariyanto</title>
  <style>
    body {
      height: 100vh;
      display: grid;
      place-content: center;
      background: #0a0a0a;
      color: #fff;
      text-align: center;
      font-family: sans-serif;
      font-size: 0.75em !important;
      margin: 0;
      touch-action: none;
      overflow: hidden;
    }
    #container {
      width: 400px;
      height: 333px;
      background: #151515;
      border-radius: 1em;
      place-content: center;
    }
    #avatar {
      image-rendering: pixelated;
      height: 8em;
      border-radius: 50%;
    }
    #user {
      position: relative;
      margin: 0;
    }
    p {
      margin: 0 0 1rem;
    }
    a {
      color: yellow;
      text-decoration: none;
    }
  </style>
</head>
<body 
  onload="
    setInterval(_ => user.style.textShadow = `0 0 ${1.5 + Math.sin(+new Date / 300)}em`, 50);
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('touchmove', e => {
      if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
  "
  onpointermove="
    container.style.transform = `perspective(900px) rotateX(${(event.y - innerHeight / 2) / -20}deg) rotateY(${(event.x - innerWidth / 2) / 20}deg)`;
    avatar.style.transform = `translate(${-(event.x - innerWidth / 2) / 10}px, ${-(event.y - innerHeight / 2) / 10}px)`;
  "
>

  <div id=container>
    <img id=avatar src=https://raw.githubusercontent.com/jokoarynt/jokoarynt.github.io/main/logo2.png>
    <h1 id=user>Joko Ariyanto</h1>
    <p>a full-stack developer<br><a href=https://github.com/jokoarynt target=_blank>[Github]</a> <a href=https://discord.com/users/1559719492014186618 target=_blank>[Discord]</a></p>
    <p><a href=https://foxwells.garden/webring/?prv&s=jokoarynt target=_top>&laquo; prev</a> | <a href=https://foxwells.garden/webring/ target=_blank>Foxwells webring</a> <a style="font-size: 60%;" href=https://foxwells.garden/webring/?rnd target=_top>(random)</a> | <a href=https://foxwells.garden/webring/?nxt&s=jokoarynt target=_top>next &raquo;</a></p>
  </div>
  <i style="position: fixed; inset: 0; pointer-events: none; background: url(data:image/webp;base64,UklGRhgAAABXRUJQVlA4TAsAAAAvAUAAEIiIP81GAAA);"></i>
</body>
</html>
