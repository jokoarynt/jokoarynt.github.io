<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo-Brutalist Guestbook</title>
</head>
<body>

  <!-- Kontainer Giscus -->
  <script src="https://giscus.app/client.js"
        data-repo="NAMA_USER_GITHUB/NAMA_REPO_GITHUB"
        data-repo-id="R_kgDOME_ID_ANDA"
        data-category="Announcements"
        data-category-id="DIC__ID_ANDA"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="https://joko.my.id/gb.css"
        data-lang="en"
        crossorigin="anonymous"
        async>
  </script>

  <!-- Skrip JavaScript Pengaman untuk Memaksa Toolbar "Aa" ke Pojok Kanan -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const observer = new MutationObserver((mutations, obs) => {
        // Menangkap elemen toolbar markdown Giscus secara presisi
        const toolbar = document.querySelector('.gsc-comment-box markdown-toolbar, .gsc-comment-box .markdown-toolbar, .gsc-comment-box [aria-label*="formatting" i]');
        
        if (toolbar) {
          // Memaksa posisi absolute menempel ke pojok kanan atas form komentar
          toolbar.style.setProperty("position", "absolute", "important");
          toolbar.style.setProperty("right", "12px", "important");
          toolbar.style.setProperty("top", "12px", "important");
          toolbar.style.setProperty("margin", "0", "important");
          toolbar.style.setProperty("z-index", "10", "important");
        }
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    });
  </script>

</body>
</html>
